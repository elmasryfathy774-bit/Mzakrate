<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إجازاتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ec; --bg2:#e4e9e2; --card:#f8faf6; --ink:#24302b; --muted:#6b7a72; --line:#d5ddd3;
  --a:#3f8f7b; --a-soft:#3f8f7b22; --b:#c98a3d; --b-soft:#c98a3d22; --glowA:#3f8f7b88; --glowB:#c98a3d88;
  --danger:#b5544b; --shadow:0 10px 30px #2a3a3214;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171d1c; --bg2:#1d2524; --card:#222b2a; --ink:#e3ebe6; --muted:#8fa199; --line:#33403e;
    --a:#5fc2a6; --a-soft:#5fc2a622; --b:#e3a95a; --b-soft:#e3a95a22; --glowA:#5fc2a688; --glowB:#e3a95a88;
    --danger:#e0796f; --shadow:0 10px 30px #00000040;
  }
}
:root[data-theme="dark"]{
  --bg:#171d1c; --bg2:#1d2524; --card:#222b2a; --ink:#e3ebe6; --muted:#8fa199; --line:#33403e;
  --a:#5fc2a6; --a-soft:#5fc2a622; --b:#e3a95a; --b-soft:#e3a95a22; --glowA:#5fc2a688; --glowB:#e3a95a88;
  --danger:#e0796f; --shadow:0 10px 30px #00000040;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;font-size:16px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:2px}
svg{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- login ---------- */
#login{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px 22px;gap:28px;
  background:radial-gradient(120% 60% at 50% 0%, var(--a-soft), transparent 70%)}
.brand{text-align:center}
.logo{width:76px;height:76px;margin:0 auto 16px;border-radius:24px;display:grid;place-items:center;background:var(--card);color:var(--a);
  box-shadow:0 0 0 1px var(--line), 0 0 40px var(--glowA)}
.logo svg{width:38px;height:38px}
.brand h1{margin:0;font-size:28px;font-weight:700}
.brand p{margin:6px 0 0;color:var(--muted)}
.providers{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.prov{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:16px;background:var(--card);box-shadow:0 0 0 1px var(--line);font-weight:500;transition:transform .15s, box-shadow .2s}
.prov:hover{box-shadow:0 0 0 1px var(--a), var(--shadow)}
.prov:active{transform:scale(.98)}
.prov .pi{width:26px;height:26px;display:grid;place-items:center}
.prov .pi svg{width:24px;height:24px;stroke:none;fill:currentColor}

/* account sheet */
.scrim{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:20}
.scrim.on{display:flex}
.sheet{width:100%;max-width:460px;background:var(--card);border-radius:24px 24px 0 0;padding:24px 22px calc(24px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet p{margin:0 0 16px;color:var(--muted);font-size:14px}
.field{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;direction:ltr;text-align:left;margin-bottom:12px}
.field.rtl{direction:rtl;text-align:right}
.btn{width:100%;padding:14px;border-radius:14px;background:var(--a);color:#fff;font-weight:600;font-size:17px;transition:transform .15s, box-shadow .3s}
:root[data-theme="dark"] .btn{color:#10201b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#10201b}}
.btn:hover{box-shadow:0 0 22px var(--glowA)}
.btn:active{transform:scale(.98)}
.err{color:var(--danger);font-size:13px;min-height:20px;margin:-4px 0 6px}

/* ---------- app ---------- */
#app{height:100%;display:none;flex-direction:column;max-width:560px;margin:0 auto}
#app.on{display:flex}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 20px 8px}
.hello{min-width:0}
.hello small{color:var(--muted);display:block;font-size:13px}
.hello h2{margin:0;font-size:22px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{display:flex;gap:8px}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--card);box-shadow:0 0 0 1px var(--line);color:var(--muted)}
.ib:hover{color:var(--ink)}
main{flex:1;overflow-y:auto;padding:8px 20px 20px}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border-radius:22px;box-shadow:0 0 0 1px var(--line), var(--shadow);padding:18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:16px;font-weight:600}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font-size:17px}
.cal-head .ib{width:36px;height:36px;border-radius:12px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{font-size:12px;color:var(--muted);padding:4px 0}
.d{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:15px;position:relative;transition:background .15s}
.d:hover:not(:disabled){background:var(--bg2)}
.d.today{box-shadow:inset 0 0 0 1.5px var(--line)}
.d.sel{background:var(--a);color:#fff;font-weight:700;box-shadow:0 0 18px var(--glowA)}
:root[data-theme="dark"] .d.sel{color:#10201b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .d.sel{color:#10201b}}
.d.taken::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--b)}
.d.out{visibility:hidden}
.picked{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--bg2);display:flex;align-items:center;gap:10px;min-height:50px;color:var(--muted)}
.picked.has{color:var(--ink);font-weight:500}
.picked svg{color:var(--a)}

/* glow slider (leave type) */
.slider{position:relative;display:grid;grid-template-columns:1fr 1fr;height:58px;border-radius:20px;background:var(--bg2);box-shadow:inset 0 2px 6px #0000001a;padding:5px;touch-action:pan-y;user-select:none}
.thumb{position:absolute;top:5px;bottom:5px;inset-inline-start:5px;width:calc(50% - 5px);border-radius:15px;background:var(--a);
  box-shadow:0 0 22px var(--glowA), 0 0 4px var(--glowA);transition:inset-inline-start .32s cubic-bezier(.3,1.3,.5,1), background .3s, box-shadow .3s}
.slider[data-v="casual"] .thumb{inset-inline-start:50%;background:var(--b);box-shadow:0 0 22px var(--glowB), 0 0 4px var(--glowB)}
.opt{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;color:var(--muted);transition:color .25s;border-radius:15px}
.slider[data-v="regular"] .opt[data-k="regular"], .slider[data-v="casual"] .opt[data-k="casual"]{color:#fff}
:root[data-theme="dark"] .slider .opt[data-k]{--x:0}
:root[data-theme="dark"] .slider[data-v="regular"] .opt[data-k="regular"],
:root[data-theme="dark"] .slider[data-v="casual"] .opt[data-k="casual"]{color:#10201b}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .slider[data-v="regular"] .opt[data-k="regular"],
  :root:not([data-theme="light"]) .slider[data-v="casual"] .opt[data-k="casual"]{color:#10201b}
}
.hint{margin:10px 2px 0;font-size:13px;color:var(--muted)}
.save{margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px}
.save[disabled]{opacity:.45;pointer-events:none}

/* history */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat{padding:16px;border-radius:18px;background:var(--card);box-shadow:0 0 0 1px var(--line);text-align:center}
.stat b{display:block;font-size:30px;line-height:1.2}
.stat span{color:var(--muted);font-size:13px}
.stat.r b{color:var(--a)}.stat.c b{color:var(--b)}
.item{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:var(--card);box-shadow:0 0 0 1px var(--line);margin-bottom:10px}
.dot{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.dot.regular{background:var(--a-soft);color:var(--a)}.dot.casual{background:var(--b-soft);color:var(--b)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600}
.item .t span{font-size:13px;color:var(--muted)}
.item .del{color:var(--muted);width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.item .del:hover{color:var(--danger);background:var(--bg2)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty svg{width:44px;height:44px;margin-bottom:8px;opacity:.6}

/* bottom nav slider */
nav{margin:0 20px calc(16px + env(safe-area-inset-bottom,0px));position:relative;display:grid;grid-template-columns:1fr 1fr;height:66px;border-radius:24px;background:var(--card);box-shadow:0 0 0 1px var(--line), var(--shadow);padding:6px}
.pill{position:absolute;top:6px;bottom:6px;inset-inline-start:6px;width:calc(50% - 6px);border-radius:18px;background:var(--a-soft);box-shadow:inset 0 0 0 1.5px var(--a), 0 0 20px var(--glowA);transition:inset-inline-start .35s cubic-bezier(.3,1.2,.5,1)}
nav[data-v="history"] .pill{inset-inline-start:50%}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:var(--muted);font-size:12.5px;font-weight:500;transition:color .25s}
.tab svg{width:26px;height:26px}
nav[data-v="add"] .tab[data-t="add"], nav[data-v="history"] .tab[data-t="history"]{color:var(--a)}

.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;opacity:0;pointer-events:none;transition:.3s;z-index:30;font-weight:500}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17M9 15l2 2 4-4"/></svg></div>

  </div>
  <div class="providers">

</section>


<!-- APP -->
<div id="app">
  <header>
    <div class="hello"><small>مرحباً بعودتك</small><h2 id="who"></h2></div>

      <button class="ib" id="theme" aria-label="تبديل المظهر"><svg viewBox="0 0 24 24"><path d="M20 14.500A8 8 0 1 1 9.500 4 6.500 6.500 0 0 0 20 14.500z"/></svg></button>
      <button class="ib" id="out" aria-label="تسجيل الخروج"><svg viewBox="0 0 24 24"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3M16 8l4 4-4 4M20 12H9"/></svg></button>
    </div>
  </header>

  <main>
    <div class="view on" id="v-add">
      <div class="card">
        <h3>اختر تاريخ الإجازة</h3>

          <button class="ib" id="next" aria-label="الشهر التالي"><svg viewBox="0 0 24 24" style="transform:scaleX(-1)"><path d="M9 6l6 6-6 6" style="transform:scaleX(-1);transform-origin:center"/></svg></button>
          <b id="mLabel"></b>
          <button class="ib" id="prev" aria-label="الشهر السابق"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
        <div class="grid" id="dows"></div>
        <div class="grid" id="days"></div>
        <div class="picked" id="picked"><svg viewBox="0 0 24 24"><rect x="3.500" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.500 10h17"/></svg><span>لم تختر يوماً بعد</span></div>
      </div>

      <div class="card">
        <h3>نوع الإجازة</h3>
        <div class="slider" id="slider" data-v="regular" role="radiogroup" aria-label="نوع الإجازة">

          <button class="opt" data-k="casual" role="radio"><svg viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg>عرضي</button>

        <p class="hint" id="hint">الإجازة الاعتيادية تكون بتخطيط مسبق.</p>

      <button class="btn save" id="save" disabled><svg viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg>حفظ الإجازة</button>
    </div>

    <div class="view" id="v-history">
      <div class="stats">
        <div class="stat r"><b id="cR">0</b><span>اعتيادي</span></div>
        <div class="stat c"><b id="cC">0</b><span>عرضي</span></div>

    <button class="tab" data-t="history"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.400-5.700L4 8.500M4 4v4.500h4.500M12 8v4.500l3 2"/></svg>الإجازات السابقة</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const TYPES={regular:'اعتيادي',casual:'عرضي'};
const HINTS={regular:'الإجازة الاعتيادية تكون بتخطيط مسبق.',casual:'الإجازة العرضية للظروف الطارئة.'};
const ICON={regular:'<svg viewBox="0 0 24 24"><path d="M3 20h18M6 20V9l6-5 6 5v11M10 20v-5h4v5"/></svg>',casual:'<svg viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg>'};

const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
let user=null, leaves=[], picked=null, type='regular', view=new Date(); view.setDate(1);
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const fmt=d=>`${DAYS[d.getDay()]}، ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}

/* theme */
(function(){const t=store.get('theme');if(t)document.documentElement.dataset.theme=t})();
$('#theme').onclick=()=>{
  const r=document.documentElement;
  const dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);
  r.dataset.theme=dark?'light':'dark'; store.set('theme',r.dataset.theme);
};

/* login: one tap, no typing */
/* ====== ضع هنا Client ID الخاص بك من Google Cloud ====== */
const GOOGLE_CLIENT_ID='10413563452-jea6ipun5tkmkm7pusap1vboe4nek7nf.apps.googleusercontent.com';   // مثال: '1234-abcd.apps.googleusercontent.com'
/* ======================================================= */
/* ====== إعدادات Firebase (تنسخها من Firebase Console) ====== */
const FIREBASE_CONFIG={
  apiKey:'AIzaSyCmSLWkyhwxv6UAhmei-vvyHcjmfSk7yDg',
  authDomain:'mzkeraty.firebaseapp.com',
  projectId:'mzkeraty',
  appId:'1:940167884386:web:a71a97eac77f88ededeb3b'
};
/* ============================================================ */
let gClient=null, fb=null;
const useFB=!!FIREBASE_CONFIG.apiKey;
function startSession(u){
  const old=JSON.parse(store.get('acct:'+u.email)||'null');
  user=Object.assign({},u,old&&old.customName?{name:old.name,customName:true}:{});
  store.set('acct:'+u.email,JSON.stringify(user));
  store.set('session',JSON.stringify(user));
  enter();
}
if(GOOGLE_CLIENT_ID&&!useFB){
  const sc=document.createElement('script');
  sc.src='https://accounts.google.com/gsi/client'; sc.async=true;
  sc.onload=()=>{
    gClient=google.accounts.oauth2.initTokenClient({
      client_id:GOOGLE_CLIENT_ID, scope:'openid email profile',
      callback:async r=>{
        if(!r||!r.access_token){toast('لم يكتمل تسجيل الدخول');return}
        try{
          const p=await (await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+r.access_token}})).json();
          startSession({email:p.email,name:p.given_name||p.name||p.email.split('@')[0],provider:'Google'});
        }catch(e){toast('تعذّر جلب بيانات الحساب')}
      }
    });
  };
  document.head.appendChild(sc);
}
function loadScript(src,cb){const x=document.createElement('script');x.src=src;x.async=true;x.onload=cb;x.onerror=()=>toast('تعذّر تحميل الخدمة، تأكد من الإنترنت');document.head.appendChild(x)}
if(useFB){
  const V='10.12.2', B='https://www.gstatic.com/firebasejs/'+V+'/';
  loadScript(B+'firebase-app-compat.js',()=>loadScript(B+'firebase-auth-compat.js',()=>loadScript(B+'firebase-firestore-compat.js',()=>{
    firebase.initializeApp(FIREBASE_CONFIG);
    fb={auth:firebase.auth(),db:firebase.firestore()};
    fb.auth.languageCode='ar';
    fb.auth.onAuthStateChanged(async u=>{
      if(!u){user=null;$('#app').classList.remove('on');$('#login').style.display='flex';return}
      try{
        const ref=fb.db.collection('users').doc(u.uid);
        const snap=await ref.get();
        const d=snap.exists?snap.data():{};
        const name=d.customName?d.name:(u.displayName||u.email.split('@')[0]).split(' ')[0];
        const base={name,email:u.email,photo:u.photoURL||'',provider:'Google',lastLogin:firebase.firestore.FieldValue.serverTimestamp()};
        if(!snap.exists)base.createdAt=firebase.firestore.FieldValue.serverTimestamp();
        await ref.set(base,{merge:true});
        const q=await ref.collection('leaves').get();
        leaves=q.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>b.date.localeCompare(a.date));
        user={uid:u.uid,email:u.email,name,customName:!!d.customName,provider:'Google'};
        enter(true);
      }catch(e){console.error(e);toast('تعذّر تحميل بياناتك، تحقق من إعدادات Firebase')}
    });
  })));
}
async function fbSignIn(){
  try{await fb.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}
  catch(e){
    if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){fb.auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider())}
    else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request'){toast('تعذّر تسجيل الدخول: '+(e.code||'')) }
  }
}
$$('.prov').forEach(b=>b.onclick=async()=>{
  const p=b.dataset.p;
  if(p==='Google'){
    if(useFB){if(!fb){toast('جارٍ التحميل، حاول مرة أخرى');return}fbSignIn();return}
    if(!GOOGLE_CLIENT_ID){toast('ضع Google Client ID داخل الملف أولاً');return}
    if(!gClient){toast('جارٍ تحميل Google، حاول مرة أخرى');return}
    gClient.requestAccessToken({prompt:''}); return;
  }
});
/* tap the name to change it */
$('#who').onclick=()=>{
  const h=$('#who'); const inp=document.createElement('input');
  inp.className='field rtl'; inp.style.margin='0'; inp.style.padding='8px 12px'; inp.value=user.name; inp.maxLength=24;
  h.replaceWith(inp); inp.focus(); inp.select();
  const done=()=>{
    const n=inp.value.trim()||user.name; user.name=n;user.customName=true;
    if(useFB&&fb){fb.db.collection('users').doc(user.uid).set({name:n,customName:true},{merge:true}).catch(()=>toast('تعذّر حفظ الاسم'))}
    else{store.set('session',JSON.stringify(user)); store.set('acct:'+user.email,JSON.stringify(user))}
    h.textContent='أهلاً بك يا '+n; inp.replaceWith(h);
  };
  inp.onblur=done; inp.onkeydown=e=>{if(e.key==='Enter')inp.blur()};
};
function enter(loaded){
  if(!loaded){try{leaves=JSON.parse(store.get('leaves:'+user.email)||'[]')}catch(e){leaves=[]}}
  $('#login').style.display='none'; $('#app').classList.add('on');
  $('#who').textContent='أهلاً بك يا '+user.name; $('#who').style.cursor='pointer';
  picked=null; type='regular'; setType('regular'); renderCal(); renderPicked(); renderList(); go('add');
}
$('#out').onclick=()=>{if(useFB&&fb){fb.auth.signOut();return}store.del('session');user=null;$('#app').classList.remove('on');$('#login').style.display='flex'};

/* calendar */
$('#dows').innerHTML=['سبت','أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة'].map(d=>`<div class="dow">${d}</div>`).join('');
function renderCal(){
  $('#mLabel').textContent=`${MONTHS[view.getMonth()]} ${view.getFullYear()}`;
  const first=view.getDay(), lead=(first+1)%7; // week starts Saturday
  const total=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  const taken=new Set(leaves.map(l=>l.date)); const today=key(new Date());
  let h=''; for(let i=0;i<lead;i++)h+='<div class="d out"></div>';
  for(let d=1;d<=total;d++){
    const k=key(new Date(view.getFullYear(),view.getMonth(),d));
    h+=`<button class="d${k===today?' today':''}${k===picked?' sel':''}${taken.has(k)?' taken':''}" data-k="${k}">${d}</button>`;
  }
  $('#days').innerHTML=h;
  $$('#days .d[data-k]').forEach(b=>b.onclick=()=>{picked=b.dataset.k;renderCal();renderPicked()});
}
$('#prev').onclick=()=>{view.setMonth(view.getMonth()-1);renderCal()};
$('#next').onclick=()=>{view.setMonth(view.getMonth()+1);renderCal()};
function renderPicked(){
  const p=$('#picked'), has=!!picked;
  p.classList.toggle('has',has);
  p.querySelector('span').textContent=has?fmt(fromKey(picked)):'لم تختر يوماً بعد';
  $('#save').disabled=!has;
}

/* type slider */
function setType(t){type=t;$('#slider').dataset.v=t;$('#hint').textContent=HINTS[t];
  $$('#slider .opt').forEach(o=>o.setAttribute('aria-checked',o.dataset.k===t))}
$$('#slider .opt').forEach(o=>o.onclick=()=>setType(o.dataset.k));
(function(){ // drag support
  const s=$('#slider'); let down=false;
  const pos=e=>{const r=s.getBoundingClientRect();const rtl=getComputedStyle(s).direction==='rtl';
    let x=(e.clientX-r.left)/r.width; if(rtl)x=1-x; setType(x<.5?'regular':'casual')};
  s.addEventListener('pointerdown',e=>{down=true;pos(e)});
  s.addEventListener('pointermove',e=>{if(down)pos(e)});
  addEventListener('pointerup',()=>down=false);
})();

/* save */
$('#save').onclick=()=>{
  if(!picked)return;
  if(leaves.some(l=>l.date===picked)){toast('هذا اليوم مسجّل بالفعل كإجازة');return}
  const it={id:String(Date.now()),date:picked,type,savedAt:new Date().toISOString()};
  leaves.push(it);
  leaves.sort((a,b)=>b.date.localeCompare(a.date));
  if(useFB&&fb){
    fb.db.collection('users').doc(user.uid).collection('leaves').doc(it.id)
      .set({date:it.date,type:it.type,savedAt:firebase.firestore.FieldValue.serverTimestamp()})
      .catch(()=>toast('تعذّر حفظ الإجازة على الإنترنت'));
  }else store.set('leaves:'+user.email,JSON.stringify(leaves));
  toast('تم حفظ الإجازة'); picked=null; renderCal(); renderPicked(); renderList();
};

/* history */
function renderList(){
  $('#cR').textContent=leaves.filter(l=>l.type==='regular').length;
  $('#cC').textContent=leaves.filter(l=>l.type==='casual').length;
  $('#list').innerHTML=leaves.length?leaves.map(l=>`
    <div class="item">
      <div class="dot ${l.type}">${ICON[l.type]}</div>
      <div class="t"><b>${fmt(fromKey(l.date))}</b><span>إجازة ${TYPES[l.type]}</span></div>
      <button class="del" data-id="${l.id}" aria-label="حذف"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
    </div>`).join(''):
    `<div class="empty"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.400-5.700L4 8.500M4 4v4.500h4.500M12 8v4.500l3 2"/></svg><div>لا توجد إجازات سابقة بعد.<br>سجّل أول إجازة من تبويب «تسجيل إجازة».</div></div>`;
  $$('#list .del').forEach(b=>b.onclick=()=>{
    leaves=leaves.filter(l=>String(l.id)!==b.dataset.id);
    if(useFB&&fb){fb.db.collection('users').doc(user.uid).collection('leaves').doc(String(b.dataset.id)).delete().catch(()=>toast('تعذّر الحذف'))}
    else store.set('leaves:'+user.email,JSON.stringify(leaves));
    renderList(); renderCal(); toast('تم حذف الإجازة');
  });
}

/* nav */
function go(v){$('#nav').dataset.v=v;$('#v-add').classList.toggle('on',v==='add');$('#v-history').classList.toggle('on',v==='history');$('main').scrollTop=0}
$$('.tab').forEach(t=>t.onclick=()=>go(t.dataset.t));

/* auto-login */
if(!useFB){try{const s=JSON.parse(store.get('session')||'null');if(s&&s.email){user=s;enter()}}catch(e){}}
</script>
</body>
</html>
